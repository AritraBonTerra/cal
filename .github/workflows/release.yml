name: Release

# Every merge to main ships: the Mac app to this repo's GitHub Releases, which the
# installed app updates from (apps/desktop/src/main/updater.ts), and the iOS app to
# TestFlight, which keeps installed iPhones current. Pull requests (and manual runs
# on other branches) build the same things without publishing, so a broken pipeline
# shows before merge, and leave the DMG and IPA as run artifacts. Only main publishes.
#
# Secrets: MAC_CERT_P12 (base64 Developer ID Application certificate + key) and
# MAC_CERT_PASSWORD; ASC_KEY (an App Store Connect API key's .p8 text, Admin role),
# ASC_KEY_ID and ASC_ISSUER_ID; APPLE_TEAM_ID. The one key notarizes the Mac app,
# signs the iOS app with Xcode's cloud-managed certificates, and uploads to TestFlight.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  # Expo SDK 58 needs Xcode 26.4 or later; pinned so a runner image change can't move it.
  XCODE: /Applications/Xcode_26.6.app

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # The major.minor in apps/desktop/package.json, then the run number, so every
      # release is newer than the last (the updater and TestFlight both need that).
      - id: version
        run: |
          base=$(jq -r '.version | split(".")[0:2] | join(".")' apps/desktop/package.json)
          echo "version=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    # Signing needs the repo's secrets, which PRs from forks and Dependabot don't get.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: sudo xcode-select -s "$XCODE"
      - name: App Store Connect key
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/asc.p8"
      # The release's tag names the commit that was built; electron-builder would
      # otherwise tag main's head when it creates the release, which may have moved on.
      - name: Tag the release
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/asc.p8
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun scripts/prepare.ts
          env -u ELECTRON_RUN_AS_NODE bunx electron-vite build
          bunx electron-builder --mac \
            --publish "$([ "$PUBLISH" = true ] && echo always || echo never)" \
            -c.extraMetadata.version="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: Cal-${{ needs.version.outputs.version }}-mac
          path: apps/desktop/release/*.dmg

  ios:
    needs: version
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: sudo xcode-select -s "$XCODE"
      # Writes the key and the xcodebuild switches that sign and upload with it.
      - name: App Store Connect key
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/asc.p8"
          echo "AUTH=-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        working-directory: apps/mobile
        env:
          CAL_VERSION: ${{ needs.version.outputs.version }}
          CAL_BUILD: ${{ github.run_number }}
        run: bunx expo prebuild --platform ios --clean
      - name: Archive
        working-directory: apps/mobile/ios
        run: |
          xcodebuild archive -workspace Cal.xcworkspace -scheme Cal -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Cal.xcarchive" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic $AUTH
      # Exported for App Store Connect; on main the export uploads it to TestFlight.
      - name: Export${{ env.PUBLISH == 'true' && ' and upload to TestFlight' || '' }}
        run: |
          plist="$RUNNER_TEMP/export.plist"
          plutil -create xml1 "$plist"
          plutil -insert method -string app-store-connect "$plist"
          plutil -insert teamID -string ${{ secrets.APPLE_TEAM_ID }} "$plist"
          plutil -insert signingStyle -string automatic "$plist"
          plutil -insert destination -string "$([ "$PUBLISH" = true ] && echo upload || echo export)" "$plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Cal.xcarchive" \
            -exportOptionsPlist "$plist" -exportPath "$RUNNER_TEMP/export" $AUTH
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH != 'true'
        with:
          name: Cal-${{ needs.version.outputs.version }}-ios
          path: ${{ runner.temp }}/export/*.ipa
