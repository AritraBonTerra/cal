# Packages the Mac app: `bun run dist` → release/Cal-<version>-arm64.dmg (+ .zip).
# Locally it signs with the identity named by CSC_NAME, if set, and isn't notarized.
# CI (.github/workflows/release.yml) signs with the Developer ID certificate in
# CSC_LINK, notarizes with the App Store Connect key in APPLE_API_KEY*, and publishes
# to GitHub Releases, which the app's updater reads (src/main/updater.ts).
appId: dev.aritra.cal
productName: Cal
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: native/calkit/.build/release/calkit
    to: calkit
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64]
    # The updater installs from the zip; the DMG is for first installs.
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCalendarsFullAccessUsageDescription: Cal shows and edits the events in your calendars.
    NSCalendarsUsageDescription: Cal shows and edits the events in your calendars.
dmg:
  title: Cal
# Google sign-in returns to the app through this URL scheme (see src/main/auth.ts).
protocols:
  - name: Cal
    schemes: [dev.aritra.cal]
publish:
  provider: github
  owner: AritraBonTerra
  repo: cal
  releaseType: release
