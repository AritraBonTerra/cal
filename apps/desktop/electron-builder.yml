# Packages the Mac app: `bun run dist` → release/Cal-<version>-arm64.dmg.
# Signs with the identity named by CSC_NAME if set (not notarized: for this Mac).
appId: dev.aritra.cal
productName: Cal
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: native/calkit/.build/release/calkit
    to: calkit
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: false
  notarize: false
  extendInfo:
    NSCalendarsFullAccessUsageDescription: Cal shows and edits the events in your calendars.
    NSCalendarsUsageDescription: Cal shows and edits the events in your calendars.
dmg:
  title: Cal
# Google sign-in returns to the app through this URL scheme (see src/main/auth.ts).
protocols:
  - name: Cal
    schemes: [dev.aritra.cal]
